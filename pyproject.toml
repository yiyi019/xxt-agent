[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xxt-agent"
version = "1.0.0"
description = "Lightweight, headless, and agent-optimized Xuexitong course automation system."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "selenium>=4.15.0",
    "requests>=2.28.0",
    "fonttools>=4.40.0",
    "numpy>=1.24.0",
    "Pillow>=9.5.0",
    "rich>=13.0.0"
]

[project.scripts]
xxt-agent = "xxt_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["xxt_agent*"]

[tool.setuptools.package-data]
xxt_agent = ["data/font_dict.txt", "extensions/*.crx", "config.example.json", "agent_tools.json"]
